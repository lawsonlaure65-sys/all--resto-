    <!-- Anti-FOUC Theme Detection Script (Detects system preference & saved user override) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('alloresto_theme_mode');
          var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = isDark ? 'dark' : 'light';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-mode', saved || 'system');
        } catch (e) {}
      })();
    </script>
