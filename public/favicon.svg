<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient for Ultra Sharp Visibility on Dark & Light Screens -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.5" />
    </linearGradient>

    <!-- Cloche Orange Solaire Gradient -->
    <linearGradient id="favChefOrange" x1="18" y1="24" x2="110" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA133" />
      <stop offset="35%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#E63E00" />
    </linearGradient>

    <!-- Headset Teal Gradient -->
    <linearGradient id="favTealPhone" x1="30" y1="10" x2="98" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0A3F3B" />
    </linearGradient>

    <!-- Plateau Métallique -->
    <linearGradient id="favSilverPlate" x1="20" y1="94" x2="108" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Premium App Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" filter="url(#softShadow)" />

  <g transform="translate(256, 256) scale(3.2) translate(-64, -64)">
    <!-- 1. Ondes Sonores & Vapeur d'Appétit "Allô" -->
    <g stroke="#FFB74D" stroke-width="2.8" stroke-linecap="round" opacity="0.95">
      <path d="M 44 18 C 50 12 56 10 64 10 C 72 10 78 12 84 18" stroke-dasharray="1 0" />
      <path d="M 52 23 C 56 20 60 19 64 19 C 68 19 72 20 76 23" />
    </g>

    <!-- Petite Étoile Dorée Saveur -->
    <path d="M 98 19 L 100 24 L 105 26 L 100 28 L 98 33 L 96 28 L 91 26 L 96 24 Z" fill="#FBBF24" />

    <!-- 2. Arceau Casque Téléphone / Poignée Toque -->
    <path d="M 46 36 C 46 25 82 25 82 36" stroke="url(#favTealPhone)" stroke-width="6.5" stroke-linecap="round" />
    <circle cx="64" cy="27" r="6" fill="#FBBF24" stroke="#D97706" stroke-width="1.5" />
    <rect x="80" y="32" width="7" height="12" rx="3.5" fill="#0F766E" />
    <path d="M 85 41 C 88 44 87 49 82 52" stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="80" cy="52.5" r="2" fill="#2DD4BF" />

    <!-- 3. Corps de la Cloche Gourmande -->
    <path
      d="M 64 34
         C 42 34 26 52 22 78
         C 21 84 25 88 32 88
         L 96 88
         C 103 88 107 84 106 78
         C 102 52 86 34 64 34
         Z"
      fill="url(#favChefOrange)"
    />

    <!-- Reflet Lumineux -->
    <path
      d="M 64 39
         C 50 39 37 49 32 64
         C 30 68 33 70 36 68
         C 40 56 50 46 64 45
         C 67 45 68 41 66 39.5
         C 65.5 39.2 64.8 39 64 39
         Z"
      fill="#FFFFFF"
      opacity="0.45"
    />

    <!-- 4. Visage Expressif & Clin d'œil Complice -->
    <path d="M 42 63 C 45 58 52 58 55 63" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <ellipse cx="74" cy="61" rx="4.8" ry="6" fill="#0F172A" />
    <circle cx="72.5" cy="59" r="2" fill="#FFFFFF" />
    <circle cx="76" cy="63" r="1" fill="#FFFFFF" />

    <!-- Pommettes -->
    <circle cx="37" cy="69" r="3.5" fill="#EF4444" opacity="0.35" />
    <circle cx="81" cy="69" r="3.5" fill="#EF4444" opacity="0.35" />

    <!-- Sourire & Langue Gourmande -->
    <path d="M 48 69 C 48 78 70 78 70 69 Z" fill="#0F172A" />
    <path d="M 55 74 C 55 77 63 77 63 74 Z" fill="#F43F5E" />

    <!-- 5. Plateau de Service -->
    <path
      d="M 18 88
         C 18 86 22 84 28 84
         L 100 84
         C 106 84 110 86 110 88
         L 108 92
         C 108 95 104 97 98 97
         L 30 97
         C 24 97 20 95 20 92
         Z"
      fill="url(#favSilverPlate)"
      stroke="#94A3B8"
      stroke-width="1"
    />
    <rect x="14" y="96" width="100" height="5" rx="2.5" fill="#475569" />
    <rect x="22" y="97" width="84" height="2" rx="1" fill="#94A3B8" opacity="0.8" />

    <!-- 6. Lignes Vitesse Express -->
    <g stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <line x1="8" y1="76" x2="16" y2="76" />
      <line x1="4" y1="84" x2="13" y2="84" />
      <line x1="7" y1="92" x2="14" y2="92" />
    </g>
  </g>
</svg>

