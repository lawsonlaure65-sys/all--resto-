<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep Navy / Charcoal Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3048" />
      <stop offset="100%" stop-color="#0F1C2E" />
    </linearGradient>

    <!-- Vibrant Sahel Express Orange Gradient -->
    <linearGradient id="expressOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A2B" />
      <stop offset="100%" stop-color="#EB5915" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="billo-express-emblem" filter="url(#subtleShadow)" transform="translate(50, 20)">
    <!-- Dynamic Circular Orange Swoosh wrapping the house & bike -->
    <path
      d="M 440 210 
         C 460 270 445 340 395 385 
         C 335 440 240 455 170 420 
         C 140 405 125 385 135 365 
         C 145 345 170 355 195 370 
         C 245 395 320 385 365 345 
         C 400 310 415 260 395 210 
         C 385 185 410 160 425 175 
         C 435 185 438 198 440 210 Z"
      fill="url(#expressOrange)"
    />

    <!-- House Roof & Chimney Silhouette (Deep Navy) -->
    <!-- Chimney -->
    <rect x="345" y="145" width="22" height="40" rx="2" fill="url(#navyGrad)" />
    <!-- Roof Triangular Gable -->
    <path
      d="M 300 120 
         L 415 210 
         L 395 210 
         L 300 138 
         L 205 210 
         L 185 210 
         Z"
      fill="url(#navyGrad)"
    />

    <!-- 4-Pane Square Window on House Facade -->
    <g transform="translate(288, 175)" fill="url(#navyGrad)">
      <rect x="0" y="0" width="10" height="10" rx="1.5" />
      <rect x="14" y="0" width="10" height="10" rx="1.5" />
      <rect x="0" y="14" width="10" height="10" rx="1.5" />
      <rect x="14" y="14" width="10" height="10" rx="1.5" />
    </g>

    <!-- Speed Lines behind Motorcycle (Express Motion) -->
    <g stroke="url(#navyGrad)" stroke-linecap="round">
      <line x1="60" y1="318" x2="200" y2="318" stroke-width="6" />
      <line x1="100" y1="300" x2="190" y2="300" stroke-width="6" />
      <line x1="75" y1="336" x2="175" y2="336" stroke-width="5" />
    </g>

    <!-- Delivery Courier Motorcycle Silhouette -->
    <!-- Rear Wheel -->
    <circle cx="215" cy="335" r="35" stroke="url(#navyGrad)" stroke-width="14" fill="none" />
    <!-- Front Wheel -->
    <circle cx="395" cy="335" r="35" stroke="url(#navyGrad)" stroke-width="14" fill="none" />

    <!-- Motorcycle Body Frame, Seat, Engine & Handlebar -->
    <path
      d="M 195 305 
         L 255 305 
         C 275 270 305 260 345 260 
         L 365 240 
         L 380 265 
         C 385 270 395 295 375 325 
         L 330 330 
         L 275 330 
         C 255 315 220 315 195 305 Z"
      fill="url(#navyGrad)"
    />

    <!-- Headlight / Shield Visor -->
    <path
      d="M 372 250 
         C 385 250 395 260 390 275 
         L 375 275 Z"
      fill="url(#navyGrad)"
    />

    <!-- Orange Delivery Parcel / Box on Rear Rack with Shield -->
    <g transform="translate(225, 230)">
      <rect x="0" y="0" width="48" height="48" rx="7" fill="url(#expressOrange)" />
      <!-- Shield Motif in Negative White -->
      <path
        d="M 24 10 
           L 36 15 
           L 36 28 
           C 36 36 24 40 24 40 
           C 24 40 12 36 12 28 
           L 12 15 
           Z"
        fill="#FFFFFF"
      />
    </g>
  </g>

  <!-- Corrected Official Brand Typography -->
  <!-- "Bilo Express" / "Billo Express" -->
  <g transform="translate(300, 480)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="58" letter-spacing="-1">
      <tspan fill="#102A43">Bilo </tspan>
      <tspan fill="#EB5915">Express</tspan>
    </text>

    <!-- Corrected Subtitle: "Livraison à Domicile Rapide" (with 'i') -->
    <text y="44" font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', sans-serif" font-weight="600" font-size="24" fill="#334E68" letter-spacing="1.2">
      Livraison à Domicile Rapide
    </text>
  </g>
</svg>
